  section: "§9.3 / Appendix A, Table 33"
  statement_es: 'El catálogo lógico define exactamente 21 puertas Zero-Trust (G1–G21) previas a la reducción.'
  statement_en: 'The logical catalog defines exactly 21 Zero-Trust gates (G1–G21) prior to reduction.'
  verifier: 'test "$(node tools/cc-sdd/dist/cli.js gates list | grep -cE "^  G[0-9]+ ")" = 21'
  expectation: pass

