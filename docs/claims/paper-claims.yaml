- id: CLM-042
  section: "§2.3 / release identity"
  statement_es: 'El pipeline de publicación construye y prueba el workspace y publica el paquete de la raíz con acceso público, nunca el workspace privado.'
  statement_en: 'The publish pipeline builds and tests the workspace and publishes the root package with public access, never the private workspace.'
  verifier: "node -e \"const fs=require('fs'),t=fs.readFileSync('.github/workflows/publish.yml','utf8'),i=t.indexOf('npm publish');process.exit(t.includes('npm publish --access public') && i>t.indexOf('npm test') && !t.slice(i).includes('working-directory') && t.includes('@brujo2020/open-sdd') ? 0 : 1)\""
  expectation: pass

- id: CLM-043
  section: "§2.3 / documentation truth"
  statement_es: 'Ningún bloque de código de la documentación anuncia el nombre sin scope, que no existe en el registro.'
  statement_en: 'No documentation code block advertises the unscoped name, which does not exist on the registry.'
  verifier: "node -e \"const fs=require('fs');const files=['README.md','docs/INSTALLATION.md','docs/QUICK-START.md','tools/cc-sdd/README.md','docs/guides/brownfield-getspecs.md','docs/guides/universal-brownfield-sdd.md'].filter(f=>fs.existsSync(f));let bad=0;const fence=String.fromCharCode(96,96,96);for(const f of files){const parts=fs.readFileSync(f,'utf8').split(fence);for(let i=1;i<parts.length;i+=2){const bare=parts[i].split('@brujo2020/open-sdd@latest').join('');if(bare.includes('open-sdd@latest'))bad++;}}process.exit(bad===0?0:1)\""
  expectation: pass
