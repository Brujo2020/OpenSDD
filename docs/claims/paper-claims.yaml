# Claims registry — §9.6 style, for this repository.
#
# The paper's own registry (`./bin/sh-claims verify` against `docs/claims/paper-claims.yaml`)
# pairs every published sentence with a command whose EXIT CODE decides the verdict. This file
# adopts that format for the open-sdd port of the reference architecture.
#
# Each entry:
#   id          stable identifier
#   section     paper section / table the claim comes from
#   statement_es / statement_en   the claim in both languages
#   verifier    a shell command runnable from the repository root; its exit code decides
#   expectation exactly one of:
#                 pass   — the text claims the command passes
#                 fail   — the text declares a gap and the command confirms it (non-zero)
#                 absent — the text declares an absence of evidence (non-zero confirms it persists)
#
# Verdict mapping (core/claims.ts, `evaluateClaim`):
#   pass   + exit 0 -> verified          pass   + non-zero -> broken
#   fail   + non-zero -> not-implemented fail   + exit 0  -> outdated-text
#   absent + non-zero -> not-measured    absent + exit 0  -> outdated-text
#
# IMPORTANT: no runner in this repository reads this file yet (`grep -rq paper-claims
# tools/cc-sdd/src` exits non-zero — see CLM-030). The registry is therefore a documentation
# artifact whose verifiers were executed by hand; the counts are recorded in
# docs/PAPER-ALIGNMENT.md. Do not describe it as automated.

